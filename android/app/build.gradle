plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.osteocampus'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.osteocampus'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/campusAssets')
}

tasks.register('copyCampusAssets', Sync) {
    from('../..') {
        include 'index.html', 'styles.css', 'data.js', 'curriculum.js', 'engine.js', 'reminders.js', 'skeleton.js', 'app.js', 'assets/**'
    }
    into layout.buildDirectory.dir('generated/campusAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyCampusAssets' }
